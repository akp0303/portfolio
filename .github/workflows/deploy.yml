name: Build and Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write  # <- Giver GITHUB_TOKEN lov til at pushe

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build (static export via next.config.ts)
        run: |
          npm run build
          test -d out || (echo "out/ not found" && ls -la && exit 1)
          touch out/.nojekyll
          echo "kjaerbaek.com" > out/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true  # hjælper hvis branchen ikke findes i forvejen
